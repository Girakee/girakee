# Deploy note: monorepo admin app — base directory must be "admin" in Netlify (2026-09-19)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = ""
  # Proxy /api/* to VM — do not set http:// IP here (browser blocks HTTPS → HTTP).

# Proxy API calls through Netlify → VM nginx (mnxstore already uses /api/ on port 80).
[[redirects]]
  from = "/api/*"
  to = "http://200.234.39.88/girakee-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
