# Deploy note: website + admin at /admin/ (2026-09-19)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = ""

# Proxy form/API calls to VPS backend (same as admin site).
[[redirects]]
  from = "/api/*"
  to = "http://200.234.39.88/girakee-api/:splat"
  status = 200
  force = true

# Admin SPA — must come before the public site catch-all.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

